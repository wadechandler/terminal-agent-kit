# Terminal Agent Kit (tak) -- Agent Definitions
# Defines available agent types and their configuration.
# User overrides go in ~/.tak/agents.yaml

providers:

  cursor-acp:
    type: acp
    name: "Cursor (ACP)"
    description: "Cursor CLI agent via Agent Client Protocol (JSON-RPC over stdio)"
    command: ["cursor", "agent", "acp"]
    auth_method: login
    list_models_command: ["cursor", "agent", "models"]
    protocol: "json-rpc"
    capabilities:
      streaming: true
      session_resume: false
      project_required: false
    output_formats:
      - text
      - json
      - stream-json

