# Terminal Agent Kit (tak) -- Agent Definitions
# Defines available agent types and their configuration.
# User overrides go in ~/.tak/agents.yaml

providers:

  cursor-acp:
    name: "Cursor (ACP)"
    description: "Cursor CLI agent via Agent Client Protocol (JSON-RPC over stdio)"
    command: ["cursor", "agent", "acp"]
    protocol: "json-rpc"
    auth:
      env_var: "CURSOR_API_KEY"
      login_command: ["cursor", "agent", "login"]
    capabilities:
      streaming: true        # To be confirmed via research
      session_resume: false   # To be confirmed via research
      project_required: false # Can run without a project folder
    output_formats:
      - text
      - json
      - stream-json

