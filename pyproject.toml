[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terminal-agent-kit"
version = "0.1.0-alpha"
description = "Transform your terminal into an agentic workspace"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Wade Chandler" },
]
keywords = ["terminal", "agent", "ai", "cli", "iterm2", "devkit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "agent-client-protocol>=0.8",
    "iterm2>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "textual>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
llm = [
    "httpx>=0.27",
]

[project.scripts]
tak = "tak.cli.main:cli"

[project.urls]
Homepage = "https://github.com/wadechandler/terminal-agent-kit"
Repository = "https://github.com/wadechandler/terminal-agent-kit"
Issues = "https://github.com/wadechandler/terminal-agent-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tak"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# SonarLint / SonarQube rule ids may appear in `# noqa:`; Ruff only accepts them if listed here.
external = ["S7503", "S7483"]
select = [
    "E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM", "TCH",
    "D", "RUF", "PIE", "RET", "PT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]
"tests/ipc/test_server.py" = ["TC003"]
"tests/scaffold/test_new_project.py" = ["TC003"]
"**/__init__.py" = ["D104"]
"src/tak/setup/starship.py" = ["RUF001"]
"src/tak/drivers/iterm2/daemon.py" = ["I001"]  # imports split by _ensure_tak_importable()

[tool.mypy]
python_version = "3.11"
strict = true

# iTerm2's Python API is dynamic; strict checking produces false positives on RPC
# decorators, Reference defaults, and symbols not listed in the package stub surface.
[[tool.mypy.overrides]]
module = [
    "tak.drivers.iterm2.rpc",
    "tak.drivers.iterm2.status_bar",
    "tak.drivers.iterm2.daemon",
    "tak.drivers.iterm2.driver",
    "tak.setup.profiles",
    "tak.setup.iterm2",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
