# Terminal Agent Kit (tak) -- Task Manifest
# Tracks all phases, tasks, and research questions.
# Status: not_started | in_progress | research | done | blocked | deferred

project:
  name: Terminal Agent Kit
  command: tak
  tagline: "Forging your terminal into an agentic environment"
  repo: terminal-agent-kit
  started: 2026-03-14

phases:

  - id: phase-0
    name: Scaffold & Research
    status: in_progress
    tasks:
      - id: p0-scaffold
        name: Project structure and initial files
        status: done
      - id: p0-research-iterm2
        name: Deep-dive iTerm2 Python API capabilities
        status: research
        notes: >
          Key question: can triggers intercept input before shell?
          Need to test trigger behavior with @ai prefix patterns.
        doc: docs/research/iterm2-api-capabilities.md
      - id: p0-research-acp
        name: Cursor CLI ACP protocol exploration
        status: research
        notes: >
          Need to discover exact JSON-RPC method names, streaming
          support, session resumption, startup latency.
        doc: docs/research/cursor-acp-integration.md
      - id: p0-research-routing
        name: Agent routing approaches (input interception vs keybinding)
        status: not_started
        notes: >
          How to distinguish @ai queries from shell commands.
          Options: triggers, shell function wrapper, readline hook,
          keybinding RPC, coprocess.
      - id: p0-prior-art
        name: Survey existing tools
        status: done
        doc: docs/research/prior-art.md
      - id: p0-naming
        name: Project naming decision
        status: done
        doc: docs/research/architecture-decisions.md
      - id: p0-ux-design
        name: UI/TUI/UX design for overlays, panels, tab management
        status: not_started
        notes: >
          Research what iTerm2 API can render (split panes, status bar,
          annotations). Design overlay concepts for agent panels, tab
          switcher, session details. Consider Rich library for CLI output.
      - id: p0-keyboard-commands
        name: Design keyboard shortcuts and command vocabulary
        status: not_started
        notes: >
          Map out keybindings for common actions: spawn agent, switch
          agent, show status, tab overlay, quick ask. Balance between
          @tak commands, tak CLI, and direct keybindings.

