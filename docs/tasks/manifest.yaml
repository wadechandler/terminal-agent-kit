research_questions:
  - id: rq-trigger-interception
    question: Can iTerm2 triggers intercept input before the shell processes it?
    status: open
    priority: high
    notes: >
      Triggers match on terminal output (post-echo). We may need shell
      integration hooks, a custom shell function, or readline wrapper
      to catch @ai before bash tries to execute it.

  - id: rq-overlay-rendering
    question: Can iTerm2 API create floating overlays or popups?
    status: open
    priority: medium
    notes: >
      Likely no native overlay support. Alternatives: split pane that
      auto-closes, status bar for brief info, Rich-rendered output in
      a temporary pane, or a separate companion TUI window.

  - id: rq-acp-methods
    question: What are the exact JSON-RPC method names for Cursor ACP?
    status: open
    priority: high

  - id: rq-acp-streaming
    question: Does ACP support streaming responses?
    status: open
    priority: medium

  - id: rq-acp-session-resume
    question: Can Cursor ACP sessions be resumed after restart?
    status: open
    priority: medium

  - id: rq-session-var-persistence
    question: Do iTerm2 user-defined variables survive session restoration?
    status: open
    priority: medium

  - id: rq-input-vs-output-hooks
    question: "Best approach for @ai routing: shell function, coprocess, trigger, or keybinding?"
    status: open
    priority: high
    notes: >
      Shell function approach: alias @ai to a function that pipes to tak.
      Coprocess approach: background process connected to shell.
      Keybinding approach: Cmd+Enter sends current line to agent via RPC.
      Each has different tradeoffs for UX, latency, and portability.

  - id: rq-security-deps
    question: Which dependencies have known CVEs or low bus factor?
    status: open
    priority: medium
    notes: >
      Need to audit iterm2, click, rich, pyyaml, httpx.
      Set up pip-audit or safety in CI.
