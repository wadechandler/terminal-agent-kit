research_questions:
  - id: rq-trigger-interception
    question: Can iTerm2 triggers intercept input before the shell processes it?
    status: answered
    priority: high
    answer: >
      No. Triggers match terminal output only. KeystrokeFilter is the
      alternative for input interception but adds complexity. Deferred.
    doc: docs/research/iterm2-api-capabilities.md

  - id: rq-overlay-rendering
    question: Can iTerm2 API create floating overlays or popups?
    status: answered
    priority: medium
    answer: >
      No native overlay support. Alternatives: split panes, status bar,
      Rich-rendered output in temporary pane, Textual TUI in tab/pane.

  - id: rq-acp-methods
    question: What are the exact JSON-RPC method names for Cursor ACP?
    status: answered
    priority: high
    answer: >
      initialize, authenticate, session/new, session/load, session/prompt,
      session/update, session/request_permission, session/cancel,
      cursor/ask_question, cursor/create_plan, cursor/update_todos.
    doc: docs/research/cursor-acp-integration.md

  - id: rq-acp-streaming
    question: Does ACP support streaming responses?
    status: answered
    priority: medium
    answer: >
      Yes, via session/update notifications with text chunks.
    doc: docs/research/acp-ecosystem.md

  - id: rq-acp-session-resume
    question: Can Cursor ACP sessions be resumed after restart?
    status: answered
    priority: medium
    answer: >
      Yes, via session/load with a previous session ID.
    doc: docs/research/cursor-acp-integration.md

  - id: rq-session-var-persistence
    question: Do iTerm2 user-defined variables survive session restoration?
    status: open
    priority: low
    notes: >
      Not yet tested. If they don't, the daemon restores them from
      state.yaml on startup anyway. Low priority.

  - id: rq-input-vs-output-hooks
    question: "Best approach for @ai routing: shell function, coprocess, trigger, or keybinding?"
    status: answered
    priority: high
    answer: >
      Decision: tak prompt (CLI to daemon via IPC). @ai as shell alias
      interim. KeystrokeFilter deferred. See ADR in
      architecture-decisions.md.
    doc: docs/research/architecture-decisions.md

  - id: rq-security-deps
    question: Which dependencies have known CVEs or low bus factor?
    status: answered
    priority: medium
    answer: >
      Full audit completed March 2026. PyYAML safe with safe_load,
      h11 needs pinning for httpx, iTerm2 app needs >=3.5.11.
    doc: docs/research/dependency-security-audit.md

  - id: rq-conceptual-model
    question: >
      What are the right primitives (process, connection, session, prompt,
      artifact) and how do they relate to tab agents, worker agents,
      pipelines, and phases? What OSS orchestration frameworks could serve
      as the pipeline engine?
    status: open
    priority: high
    notes: >
      Initial conceptual model captured in the workflow architecture doc.
      Distinguishes tab agents (user-driven, interactive) from worker agents
      (pipeline-driven, task-scoped). Pipelines reach down to process
      spawning. Needs further iteration before defining a pipeline
      orchestration phase. LangGraph, CrewAI, AutoGen, Prefect/Dagster/
      Temporal evaluated as candidates.
    doc: docs/research/multi-agent-workflow-architecture.md
