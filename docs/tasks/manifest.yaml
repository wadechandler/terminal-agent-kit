# yaml-language-server: $schema=../../config/tak-task-manifest.schema.json
# Terminal Agent Kit (tak) -- Task Manifest
# Tracks all phases, tasks, and research questions.
# Status: not_started | in_progress | research | done | blocked | deferred
#
# Last updated: 2026-03-23 (README/docs refresh, documentation-maintenance rule, docs-site phase)

project:
  name: Terminal Agent Kit
  command: tak
  tagline: "Transform your terminal into an agentic workspace"
  repo: terminal-agent-kit
  started: 2026-03-14

phases:

  - id: phase-0
    name: Scaffold & Research
    status: done
    tasks:
      - id: p0-scaffold
        name: Project structure and initial files
        status: done
      - id: p0-research-iterm2
        name: Deep-dive iTerm2 Python API capabilities
        status: done
        notes: >
          Triggers are output-only (cannot intercept input).
          KeystrokeFilter identified as alternative (deferred).
          StatusBarComponent is text-only, uses "Call Script Function"
          for clicks. user.tak_* variable namespace chosen. Split pane,
          tab activation, defaults write, Preferences API all validated.
        doc: docs/research/iterm2-api-capabilities.md
      - id: p0-research-acp
        name: Cursor CLI ACP protocol exploration
        status: done
        notes: >
          Full ACP session flow documented. JSON-RPC methods: initialize,
          authenticate, session/new, session/prompt, session/update,
          session/request_permission, session/cancel. --model flag and
          agent models command confirmed. Session modes: ask, plan, agent.
        doc: docs/research/cursor-acp-integration.md
      - id: p0-research-routing
        name: Agent routing approaches (input interception vs keybinding)
        status: done
        notes: >
          Decision: defer @ai interception. Users interact via
          tak prompt (CLI to daemon over IPC). @ai as shell alias is
          interim. KeystrokeFilter for future polish.
        doc: docs/research/architecture-decisions.md
      - id: p0-prior-art
        name: Survey existing tools
        status: done
        doc: docs/research/prior-art.md
      - id: p0-naming
        name: Project naming decision
        status: done
        doc: docs/research/architecture-decisions.md
      - id: p0-ux-design
        name: UI/TUI/UX design for overlays, panels, tab management
        status: done
        notes: >
          Status bar component, RPC functions, keybinding actions,
          TUI dashboard all designed. No native overlays -- split panes
          and Textual TUI chosen instead.
      - id: p0-keyboard-commands
        name: Design keyboard shortcuts and command vocabulary
        status: done
        notes: >
          Keybinding RPCs designed: tak_list_agents (Cmd+Shift+L),
          tak_switch_to_agent (Cmd+Shift+G), tak_spawn_agent (Cmd+Shift+N),
          tak_stop_agent (Cmd+Shift+X), tak_agent_menu (Cmd+Shift+A).
          All have CLI equivalents.
      - id: p0-research-security
        name: Dependency security audit and iTerm2 security review
        status: done
        doc: docs/research/dependency-security-audit.md
      - id: p0-research-acp-ecosystem
        name: ACP ecosystem landscape (Cursor, Goose, Claude)
        status: done
        doc: docs/research/acp-ecosystem.md
      - id: p0-research-terminal-setup
        name: Terminal environment setup research (Starship, fonts, bash)
        status: done
        doc: docs/research/terminal-setup.md
      - id: p0-research-future-vision
        name: Agent session mode future vision (Warp-like)
        status: done
        doc: docs/research/future-agent-session-mode.md

  - id: phase-1
    name: "MVP: Talk to an Agent"
    status: done
    notes: >
      Core skeleton complete. CLI, IPC, daemon, providers, state,
      session registry, status bar, RPCs all implemented and tested.
    tasks:
      - id: p1-core-config
        name: Config loading from YAML
        status: done
        notes: src/tak/core/config.py -- loads default.yaml + user overlay
      - id: p1-core-agent-manager
        name: AgentManager -- spawn, stop, list agents
        status: done
        notes: >
          src/tak/core/agent_manager.py -- AgentHandle with model param,
          spawn/stop/list/running_agents methods
      - id: p1-provider-cursor-acp
        name: Cursor ACP provider (basic skeleton)
        status: done
        notes: >
          src/tak/providers/cursor_acp.py -- spawn with --model, list_models,
          basic send/stop. Full ACP session lifecycle is Phase F.
      - id: p1-core-agent-bus
        name: AgentBus -- route messages from tab to agent
        status: done
        notes: src/tak/core/agent_bus.py
      - id: p1-core-session-registry
        name: SessionRegistry -- tab-agent associations
        status: done
        notes: src/tak/core/session_registry.py
      - id: p1-driver-iterm2-daemon
        name: iTerm2 daemon script (AutoLaunch)
        status: done
        notes: >
          src/tak/drivers/iterm2/daemon.py -- AgentManager + SessionRegistry +
          StateManager + IPC server + status bar + RPCs
      - id: p1-driver-iterm2-trigger
        name: iTerm2 @ai trigger or keybinding RPC
        status: deferred
        notes: >
          Triggers cannot intercept input. Deferred; see
          phase-input-interception.
      - id: p1-driver-iterm2-statusbar
        name: iTerm2 status bar component (active agent)
        status: done
        notes: src/tak/drivers/iterm2/status_bar.py
      - id: p1-cli-basic
        name: "tak CLI: spawn, stop, status, ask, agents, switch, menu"
        status: done
        notes: >
          src/tak/cli/main.py -- all commands wired to daemon via IPC.
      - id: p1-state-persistence
        name: State persistence to ~/.tak/state.yaml
        status: done
        notes: src/tak/core/state.py -- save/load/clear
      - id: p1-ipc
        name: Unix socket IPC server and client
        status: done
        notes: >
          src/tak/ipc/ -- protocol.py (length-prefixed JSON), server.py,
          client.py. Daemon serves, CLI connects.
      - id: p1-rpc-functions
        name: iTerm2 RPC functions for keybinding actions
        status: done
        notes: >
          src/tak/drivers/iterm2/rpc.py -- tak_list_agents, tak_switch_to_agent,
          tak_stop_agent, tak_agent_menu
      - id: p1-driver-extensions
        name: BaseDriver and ITerm2Driver activate_session + split_pane
        status: done
        notes: >
          src/tak/drivers/base.py -- TAK_VAR_* constants, abstract methods.
          src/tak/drivers/iterm2/driver.py -- implementations.
      - id: p1-model-selection
        name: Model param in AgentHandle, spawn, providers
        status: done
        notes: >
          model param flows through AgentHandle -> AgentManager.spawn() ->
          provider.spawn() -> --model CLI flag
      - id: p1-probe-script
        name: iTerm2 API probe script
        status: done
        notes: >
          scripts/iterm2_probe.py -- validates list sessions, set/get vars,
          activate tab, split pane, register RPC, status bar. All 8 tests pass.
      - id: p1-ad-hoc-mode
        name: "Ad-hoc mode: agent without a project folder"
        status: done
        notes: >
          Implemented in Phase K (multi-agent resilience).
          src/tak/core/adhoc.py -- AdHocManager with auto-stop.

  - id: phase-f
    name: ACP Permission and Interaction Relay
    status: done
    task_file: docs/tasks/phase-f-acp-permissions.md
    notes: >
      Full ACP session lifecycle: initialize, authenticate, session/new,
      prompt, permission relay, streaming, cancel.
    tasks:
      - id: pf-acp-session
        name: ACP session manager (JSON-RPC lifecycle over stdio)
        status: done
        notes: src/tak/providers/acp_session.py
      - id: pf-cursor-acp-update
        name: Update CursorACPProvider with full ACP flow
        status: done
        notes: src/tak/providers/cursor_acp.py
      - id: pf-permission-relay
        name: Permission relay in daemon (request_permission to user)
        status: done
        notes: >
          daemon.py _wire_permission_relay + KeystrokeMonitor for y/n/a
      - id: pf-ipc-ask
        name: IPC extension for tak prompt to stream through daemon
        status: done
        notes: IPCServer.ask method in server.py (to be renamed in ptf-rename-ask-to-prompt)

  - id: phase-g
    name: Terminal Environment Setup
    status: done
    task_file: docs/tasks/phase-g-setup-commands.md
    notes: >
      All tak setup commands. Idempotent. Tested with mocks.
    tasks:
      - id: pg-setup-iterm2
        name: "tak setup iterm2: enable API, install daemon, configure prefs"
        status: done
        notes: src/tak/setup/iterm2.py
      - id: pg-setup-fonts
        name: "tak setup fonts: JetBrainsMono Nerd Font via brew"
        status: done
        notes: src/tak/setup/fonts.py
      - id: pg-setup-starship
        name: "tak setup starship: install, configure, tak custom module"
        status: done
        notes: src/tak/setup/starship.py + config/starship.toml
      - id: pg-setup-shell
        name: "tak setup shell: .bashrc with managed markers"
        status: done
        notes: src/tak/setup/shell.py
      - id: pg-setup-profiles
        name: "tak setup profiles: opinionated iTerm2 profiles"
        status: done
        notes: src/tak/setup/profiles.py
      - id: pg-setup-tak
        name: "tak setup tak: all-in-one orchestrator"
        status: done
        notes: src/tak/setup/tak_setup.py

  - id: phase-h
    name: Generic ACP Provider
    status: done
    task_file: docs/tasks/phase-h-generic-acp.md
    notes: >
      Refactored CursorACPProvider to generic ACPProvider. Added
      TerminalSessionProvider. Config-driven provider loading.
    tasks:
      - id: ph-generic-acp
        name: Generic ACPProvider for any ACP-compliant agent
        status: done
        notes: src/tak/providers/acp.py
      - id: ph-terminal-session
        name: TerminalSessionProvider for agents with own TUI
        status: done
        notes: src/tak/providers/terminal_session.py
      - id: ph-cursor-compat
        name: CursorACPProvider backwards-compat alias
        status: done
        notes: src/tak/providers/cursor_acp.py inherits ACPProvider
      - id: ph-config-providers
        name: Load providers from config in daemon
        status: done
        notes: >
          config/agents.yaml + daemon.py _build_providers_from_config

  - id: phase-i
    name: Agent Management TUI
    status: done
    task_file: docs/tasks/phase-i-agent-tui.md
    notes: >
      Textual-based dashboard with agent table and keybindings.
    tasks:
      - id: pi-textual-app
        name: Textual app with agent table and keybindings
        status: done
        notes: src/tak/tui/app.py
      - id: pi-stylesheet
        name: TUI stylesheet and visual design
        status: done
        notes: src/tak/tui/tak.tcss
      - id: pi-wire-cli
        name: Wire tak menu to launch TUI
        status: done
        notes: src/tak/cli/main.py menu command

  - id: phase-j-scaffold
    name: Scaffold & Project Creation
    status: done
    task_file: docs/tasks/phase-j-scaffold-project.md
    notes: >
      tak scaffold commands + tak new project. Template-driven.
    tasks:
      - id: pj-scaffold-agents
        name: "tak scaffold agents: generate AGENTS.md from templates"
        status: done
        notes: src/tak/scaffold/agents_md.py
      - id: pj-scaffold-rules
        name: "tak scaffold rules: generate .cursor/rules/ structure"
        status: done
        notes: src/tak/scaffold/rules.py
      - id: pj-scaffold-skills
        name: "tak scaffold skills: generate SKILL.md"
        status: done
        notes: src/tak/scaffold/skills.py
      - id: pj-new-project
        name: "tak new project: interactive or quick project creation"
        status: done
        notes: src/tak/scaffold/new_project.py
      - id: pj-templates
        name: Template files for scaffold generation
        status: done
        notes: src/tak/scaffold/templates/

  - id: phase-k-resilience
    name: Multi-Agent & Resilience
    status: done
    task_file: docs/tasks/phase-l-multi-agent-resilience.md
    notes: >
      Multi-agent named instances, restart recovery, ad-hoc mode.
    tasks:
      - id: pk-multi-agent
        name: Multiple simultaneous agents with named instances
        status: done
        notes: >
          AgentManager validate_agent_name, rename, get_by_provider.
      - id: pk-restart-recovery
        name: Re-spawn agents on iTerm2 restart from state.yaml
        status: done
        notes: >
          daemon.py _restore_full_state, StateManager auto_save.
      - id: pk-ad-hoc-mode
        name: Ad-hoc agent without project folder
        status: done
        notes: src/tak/core/adhoc.py -- AdHocManager

  - id: phase-tryout-fixes
    name: Tryout Walkthrough Fixes
    status: in_progress
    notes: >
      Issues discovered during the first end-to-end tryout (2026-03-16).
      Some fixes applied inline; remaining items listed below.
    tasks:
      - id: ptf-daemon-syspath
        name: "Daemon sys.path fix for iTerm2's bundled Python"
        status: done
        notes: >
          daemon.py _ensure_tak_importable() resolves symlink back to src/.
      - id: ptf-iterm2env-install
        name: "Install tak into iTerm2's iterm2env (python3 -m pip, not bare pip)"
        status: done
        notes: >
          pip shebang in iterm2env/ points to iterm2env-79/, a stale env.
          Must use python3 -m pip. tak setup should automate this.
      - id: ptf-subprocess-path
        name: "Extend subprocess PATH in daemon (cursor, claude not found)"
        status: done
        notes: >
          _subprocess_env() in acp.py adds /usr/local/bin, /opt/homebrew/bin,
          ~/.local/bin. shutil.which resolves command before exec.
      - id: ptf-acp-protocol-version
        name: "ACP initialize: send protocolVersion, clientInfo, clientCapabilities"
        status: done
        notes: Previously sent empty params; Cursor requires protocolVersion=1.
      - id: ptf-acp-session-params
        name: "ACP session/new: pass cwd, model, mcpServers via protocol not CLI flags"
        status: done
        notes: >
          cursor agent acp accepts no CLI flags. --project and --model
          must go through session/new params. mcpServers=[] is required.
      - id: ptf-daemon-diag-logging
        name: "Daemon startup diagnostic logging (PATH, Python version, CLIs)"
        status: done
      - id: ptf-adopt-acp-sdk
        name: "Adopt official agent-client-protocol Python SDK (v0.8.1)"
        status: done
        notes: >
          Replaced hand-rolled ACPSessionManager with SDK-backed wrapper.
          TakACPClient implements acp.Client protocol for session_update and
          request_permission callbacks. spawn_agent_process wires stdio.
          session_id persisted in state.yaml for future session/load support.
      - id: ptf-ask-empty-response
        name: "tak prompt returns empty response (streaming/prompt collection)"
        status: done
        notes: >
          Fixed by SDK adoption. TakACPClient.session_update() extracts text
          from AgentMessageChunk.content.text. prompt() waits for SDK's
          conn.prompt() to complete, draining all queued chunks.
      - id: ptf-setup-iterm-pip
        name: "tak setup should auto-install tak into iterm2env"
        status: done
        notes: >
          setup_iterm2_pip() in iterm2.py globs iterm2env/versions/*/bin/python3,
          runs python3 -m pip install -e. Wired into tak setup tak and
          standalone tak setup iterm2-pip. Tested with mocks.
      - id: ptf-profile-api-compat
        name: "tak setup profiles: Profile.async_create not found"
        status: not_started
        notes: >
          iterm2 Python package v2.11+ removed Profile.async_create.
          Needs updated API call or alternative approach.
      - id: ptf-signal-handling
        name: "Daemon SIGTERM handler for graceful agent shutdown"
        status: done
        notes: >
          Registered SIGTERM/SIGINT handlers via loop.add_signal_handler().
          Graceful shutdown stops all agents (5s timeout each), closes IPC
          server, saves final state. Note: iTerm2 console "Terminate" uses
          SIGKILL (uncatchable), so immediate-save-on-change (_auto_save
          in _handle_associate) is the primary reliability mechanism.
          Fixed 2026-03-21.
      - id: ptf-tryout-guide-fixes
        name: "Tryout guide corrections (socket path, cleanup, asdf note)"
        status: done
        notes: >
          Fixed socket path refs to ~/.tak/daemon.sock. Added iterm2env
          cleanup step (1b). Added asdf set -u python note in Prerequisites.
      - id: ptf-custom-scripts-folder
        name: "Daemon deploy should check iTerm2 custom scripts folder setting"
        status: not_started
      - id: ptf-troubleshooting-guide
        name: "Add troubleshooting guide (Script Console, common errors)"
        status: not_started
      - id: ptf-rename-ask-to-prompt
        name: "Rename 'tak ask' to 'tak prompt' (with 'tak p' shorthand)"
        status: done
        priority: medium
        notes: >
          CLI command renamed to 'tak prompt' with 'tak p' shorthand. 'tak ask'
          kept as hidden alias for backward compat. IPC server accepts both
          'ask' and 'prompt' methods. Fixed 2026-03-18 (ACP analysis breakout).
      - id: ptf-relay-context-object
        name: "Refactor _wire_permission_relay to accept a context dataclass"
        status: not_started
        notes: >
          Replace growing parameter list (registry, connection, agent_manager, ...)
          with a single context dataclass. Avoids adding a new param every time
          a new dependency is needed by the permission callback.
      - id: ptf-active-driver-registry
        name: "Introduce active driver concept for multi-terminal support"
        status: not_started
        notes: >
          Today the daemon hardcodes iTerm2 and the CLI hardcodes
          ITerm2Driver.detect_session_id(). When a second terminal driver is
          added, the daemon should register its driver type on startup (e.g.
          via state file or IPC driver_info response) so the CLI can discover
          which driver is active and call the right detect_session_id() without
          hardcoding.
      - id: ptf-cross-terminal-safety
        name: "Defensive handling for cross-terminal CLI/daemon mismatches"
        status: not_started
        notes: >
          Scenarios: (1) daemon is iTerm2 but CLI runs from Kitty/Terminal.app --
          session IDs are meaningless cross-terminal, permissions can't be relayed;
          (2) multiple daemons from different terminals fighting over the socket;
          (3) CLI from a non-terminal context (VS Code, SSH, CI). The daemon
          should expose its driver type via IPC so the CLI can detect mismatches
          and warn clearly. Consider socket namespacing per driver
          (daemon-iterm2.sock) if multi-daemon support is needed. Graceful
          degradation: commands that don't need tab association should still
          work cross-terminal.
      - id: ptf-invalid-model-feedback
        name: "Surface invalid model errors back to the CLI user"
        status: not_started
        notes: >
          When tak spawn --model <bad-id> is given and set_session_model fails
          (e.g. -32602 Invalid params), the daemon logs a warning but the CLI
          user sees no indication the model switch failed. The IPC spawn
          response should carry a warnings list so the CLI can print
          "Warning: model 'bad-id' not accepted by agent; using default
          <actual-model>." Requires extending IPCResponse with an optional
          warnings field and updating the CLI to display them.
      - id: ptf-models-command
        name: "tak models command to list available models for a provider/agent"
        status: not_started
        notes: >
          Add a tak models [agent|provider] command. For a running agent, query
          the ACP session's NewSessionResponse.models.available_models to list
          model IDs the agent supports. For a provider not yet spawned, use the
          agent CLI's list-models command if available (e.g. cursor agent models).
          Display as a table with model ID and whether it's the current model.
          Requires an IPC handler and possibly caching the available_models list
          on ACPSessionManager after new_session().
      - id: ptf-prompt-policy-rejects-unexpectedly
        name: "PROMPT policy rejects tool calls when tab lookup fails"
        status: done
        priority: high
        notes: >
          Sub-issue (1) fixed: handle_permission now falls back to
          handle.associated_tabs when SessionRegistry lookup returns None,
          mirroring _resolve_agent_for_session in server.py.
          Sub-issues (2) ad-hoc AUTO_ALLOW and (3) restore race remain as
          follow-up items for Phase M (session persistence).
          Partial fix 2026-03-18 (ACP analysis breakout).
      - id: ptf-spawn-cwd-default
        name: "Default CWD to caller's directory when --project is omitted"
        status: done
        priority: high
        notes: >
          CLI now sends os.getcwd() as project_path when --project is omitted
          (spawn and ask commands). spawn_agent_process also receives cwd= so
          the OS-level subprocess CWD matches the ACP session CWD.
          Fixed 2026-03-18 (QF-1, QF-2 from ACP analysis breakout).
      - id: ptf-model-display-name
        name: "Show human-readable model name instead of raw model ID"
        status: done
        notes: >
          ACP NewSessionResponse.models.available_models carries both model_id
          (e.g. "default[]") and name (e.g. "Default"). Updated
          ACPSessionManager to capture current_model_name and agent_manager to
          prefer it for display. tak agents now shows the readable name.
          Bracket-suffix resolution (_resolve_model_name, _resolve_model_id)
          and Rich markup escaping added 2026-03-17. 15 new unit tests.
      - id: ptf-mcp-passthrough
        name: "Enable MCP servers for ACP agents via --with-mcp flag"
        status: deferred
        priority: high
        notes: >
          Promoted to standalone phase-mcp-integration (2026-03-18).
          Scope grew beyond a tryout fix based on ACP behavior research.
          See phase-mcp-integration and analysis §15.
      - id: ptf-starship-noninteractive
        name: "Guard starship init for non-interactive shells"
        status: done
        notes: >
          Starship errors in non-interactive shells (TERM=dumb) when sourcing
          .bashrc. Fixed by wrapping eval in [[ $- == *i* ]] guard in the
          managed block. Fixed 2026-03-18 (QF-5 from ACP analysis breakout).
      - id: ptf-event-logging
        name: "Log all ACP session update types and extension methods"
        status: done
        notes: >
          session_update now logs AgentThoughtChunk, ToolCallUpdate, and
          unknown update types. ext_method and ext_notification log the
          method name. Fixed 2026-03-18 (QF-3, QF-4 from ACP analysis breakout).
      - id: ptf-prune-stale-tabs
        name: "Prune stale tab IDs from AgentHandle on daemon restart"
        status: done
        notes: >
          _restore_full_state now filters handle.associated_tabs against
          available_sessions after restoring associations. Registry was
          already correct; the display data in AgentHandle was stale.
          Fixed 2026-03-19.
      - id: ptf-model-id-resolution
        name: "Fix model ID resolution: display name sent instead of model ID"
        status: done
        priority: high
        notes: >
          On restore, handle.model contained display name "Auto" which was
          sent to set_session_model instead of model ID "default[]".
          (1) _resolve_model_id now does reverse lookup by display name.
          (2) Skip set_session_model when resolved ID matches current model.
          (3) Added model_id field to AgentHandle, persisted in state.yaml,
          preferred over display name during restore. Fixed 2026-03-21.
      - id: ptf-session-id-format-mismatch
        name: "Fix session ID format mismatch between CLI and Python API"
        status: done
        priority: high
        notes: >
          $ITERM_SESSION_ID uses w0t0p0:UUID format but iTerm2 Python API
          session.session_id returns bare UUID. Added _strip_session_prefix()
          normalisation so restore correctly matches sessions. Fixed 2026-03-21.
      - id: ptf-associate-state-persistence
        name: "Persist state immediately on tak associate (not just periodic save)"
        status: done
        priority: high
        notes: >
          _handle_associate in IPC server updated in-memory state but never
          called _auto_save(). Association was lost if daemon was killed
          before the 30s periodic save. Added _auto_save() call to match
          _handle_spawn and _handle_set_permissions. Fixed 2026-03-21.
      - id: ptf-switch-ipc-handler
        name: "Implement IPC handler for tak switch command"
        status: done
        notes: >
          Added _handle_switch to IPCServer with activate_tab callback.
          Daemon passes iTerm2 tab activation closure. Multi-tab: activates
          most recently associated tab. 5 new tests. Fixed 2026-03-19.

  # ------------------------------------------------------------------
  # New phases identified during gap analysis (2026-03-16)
  # ------------------------------------------------------------------

  - id: phase-m-conversation
    name: Conversation and Context
    status: done
    task_file: docs/tasks/phase-m-conversation.md
    notes: >
      Session lifecycle management on top of existing persistence: reset,
      reconnection, mode/model control via set_config_option, configurable
      CWD injection. Session persistence across tak prompt calls already
      works. Keeps the 1:1:1 model (one agent = one process = one session);
      multi-session support deferred until conceptual model is settled.
      Level 1 of the graduated conversation design (ADR-016).
      Completed 2026-03-21.
    tasks:
      - id: pm-session-lifecycle
        name: "close_session() drops session; next prompt creates fresh one"
        status: done
      - id: pm-cwd-awareness
        name: "tak prompt sends user CWD; daemon attaches to bus messages"
        status: done
      - id: pm-cwd-configurable
        name: "Configurable CWD injection format (xml/bracket/json/none)"
        status: done
        notes: >
          User CWD (os.getcwd at prompt time) is distinct from the session
          CWD (set once at new_session). Format configurable via config.yaml
          prompt.cwd_context.format. Default xml for cleanest agent behavior.
      - id: pm-mode-selection
        name: "--mode ask|plan|agent flag on tak prompt"
        status: done
      - id: pm-session-end
        name: "tak session end [agent] command to reset conversation"
        status: done
      - id: pm-session-reconnect
        name: "Reconnect to existing ACP session on daemon restart via load_session"
        status: done
        notes: >
          ACPProvider.spawn() accepts optional acp_session_id; tries
          load_session() first, falls back to new_session() on any error.
          AgentManager.restore() passes saved acp_session_id from state.yaml.
          Conversation history preserved across daemon restarts when Cursor
          still holds the session. Fixed 2026-03-21.
      - id: pm-config-option-mutation
        name: "Use set_config_option as primary mutation path for mode/model"
        status: done
        notes: >
          Analysis §4: set_config_option works for both mode and model changes.
          Response returns full refreshed configOptions. Mode changes fire
          CurrentModeUpdate notifications; model changes do not (update from
          synchronous response). Replaces separate set_session_mode/model calls.
          Implemented 2026-03-21 in ACPSessionManager.new_session + set_config_option().

