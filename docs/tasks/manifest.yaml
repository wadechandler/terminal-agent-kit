# yaml-language-server: $schema=
# Terminal Agent Kit (tak) -- Task Manifest
# Tracks all phases, tasks, and research questions.
# Status: not_started | in_progress | research | done | blocked | deferred
#
# Last updated: 2026-03-16

project:
  name: Terminal Agent Kit
  command: tak
  tagline: "Forging your terminal into an agentic environment"
  repo: terminal-agent-kit
  started: 2026-03-14

phases:

  - id: phase-0
    name: Scaffold & Research
    status: done
    tasks:
      - id: p0-scaffold
        name: Project structure and initial files
        status: done
      - id: p0-research-iterm2
        name: Deep-dive iTerm2 Python API capabilities
        status: done
        notes: >
          Triggers are output-only (cannot intercept input).
          KeystrokeFilter identified as alternative (deferred).
          StatusBarComponent is text-only, uses "Call Script Function"
          for clicks. user.tak_* variable namespace chosen. Split pane,
          tab activation, defaults write, Preferences API all validated.
        doc: docs/research/iterm2-api-capabilities.md
      - id: p0-research-acp
        name: Cursor CLI ACP protocol exploration
        status: done
        notes: >
          Full ACP session flow documented. JSON-RPC methods: initialize,
          authenticate, session/new, session/prompt, session/update,
          session/request_permission, session/cancel. --model flag and
          agent models command confirmed. Session modes: ask, plan, agent.
        doc: docs/research/cursor-acp-integration.md
      - id: p0-research-routing
        name: Agent routing approaches (input interception vs keybinding)
        status: done
        notes: >
          Decision: defer @ai interception. Users interact via
          tak ask (CLI to daemon over IPC). @ai as shell alias is
          interim. KeystrokeFilter for future polish.
        doc: docs/research/architecture-decisions.md
      - id: p0-prior-art
        name: Survey existing tools
        status: done
        doc: docs/research/prior-art.md
      - id: p0-naming
        name: Project naming decision
        status: done
        doc: docs/research/architecture-decisions.md
      - id: p0-ux-design
        name: UI/TUI/UX design for overlays, panels, tab management
        status: done
        notes: >
          Status bar component, RPC functions, keybinding actions,
          TUI dashboard all designed. No native overlays -- split panes
          and Textual TUI chosen instead.
      - id: p0-keyboard-commands
        name: Design keyboard shortcuts and command vocabulary
        status: done
        notes: >
          Keybinding RPCs designed: tak_list_agents (Cmd+Shift+L),
          tak_switch_to_agent (Cmd+Shift+G), tak_spawn_agent (Cmd+Shift+N),
          tak_stop_agent (Cmd+Shift+X), tak_agent_menu (Cmd+Shift+A).
          All have CLI equivalents.
      - id: p0-research-security
        name: Dependency security audit and iTerm2 security review
        status: done
        doc: docs/research/dependency-security-audit.md
      - id: p0-research-acp-ecosystem
        name: ACP ecosystem landscape (Cursor, Goose, Claude)
