  - id: phase-tryout-fixes
    name: Tryout Walkthrough Fixes
    status: in_progress
    notes: >
      Issues discovered during the first end-to-end tryout (2026-03-16).
      Some fixes applied inline; remaining items listed below.
    tasks:
      - id: ptf-daemon-syspath
        name: "Daemon sys.path fix for iTerm2's bundled Python"
        status: done
        notes: >
          daemon.py _ensure_tak_importable() resolves symlink back to src/.
      - id: ptf-iterm2env-install
        name: "Install tak into iTerm2's iterm2env (python3 -m pip, not bare pip)"
        status: done
        notes: >
          pip shebang in iterm2env/ points to iterm2env-79/, a stale env.
          Must use python3 -m pip. tak setup should automate this.
      - id: ptf-subprocess-path
        name: "Extend subprocess PATH in daemon (cursor, claude not found)"
        status: done
        notes: >
          _subprocess_env() in acp.py adds /usr/local/bin, /opt/homebrew/bin,
          ~/.local/bin. shutil.which resolves command before exec.
      - id: ptf-acp-protocol-version
        name: "ACP initialize: send protocolVersion, clientInfo, clientCapabilities"
        status: done
        notes: Previously sent empty params; Cursor requires protocolVersion=1.
      - id: ptf-acp-session-params
        name: "ACP session/new: pass cwd, model, mcpServers via protocol not CLI flags"
        status: done
        notes: >
          cursor agent acp accepts no CLI flags. --project and --model
          must go through session/new params. mcpServers=[] is required.
      - id: ptf-daemon-diag-logging
        name: "Daemon startup diagnostic logging (PATH, Python version, CLIs)"
        status: done
      - id: ptf-adopt-acp-sdk
        name: "Adopt official agent-client-protocol Python SDK (v0.8.1)"
        status: done
        notes: >
          Replaced hand-rolled ACPSessionManager with SDK-backed wrapper.
          TakACPClient implements acp.Client protocol for session_update and
          request_permission callbacks. spawn_agent_process wires stdio.
          session_id persisted in state.yaml for future session/load support.
      - id: ptf-ask-empty-response
        name: "tak ask returns empty response (streaming/prompt collection)"
        status: done
        notes: >
          Fixed by SDK adoption. TakACPClient.session_update() extracts text
          from AgentMessageChunk.content.text. prompt() waits for SDK's
          conn.prompt() to complete, draining all queued chunks.
      - id: ptf-setup-iterm-pip
        name: "tak setup should auto-install tak into iterm2env"
        status: done
        notes: >
          setup_iterm2_pip() in iterm2.py globs iterm2env/versions/*/bin/python3,
          runs python3 -m pip install -e. Wired into tak setup tak and
          standalone tak setup iterm2-pip. Tested with mocks.
      - id: ptf-profile-api-compat
        name: "tak setup profiles: Profile.async_create not found"
        status: not_started
        notes: >
          iterm2 Python package v2.11+ removed Profile.async_create.
          Needs updated API call or alternative approach.
      - id: ptf-signal-handling
        name: "Daemon SIGTERM handler for graceful agent shutdown"
        status: not_started
        notes: >
          Currently relies on finally block which may not run if killed.
          Register asyncio signal handler for SIGTERM.
      - id: ptf-tryout-guide-fixes
